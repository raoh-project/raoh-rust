[package]
name = "raoh"
version = "0.9.0-dev"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Decoders that turn untyped JSON into typed domain values, reporting every issue with its path"
repository = "https://github.com/raoh-project/raoh-rust"
readme = "README.md"
keywords = ["decoder", "validation", "json", "parse", "domain"]
categories = ["parsing", "encoding"]
exclude = [".github/", "scripts/", "conformance/"]

[dependencies]
serde = "1"
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.5"
num-traits = "0.2"
# The text rules Raoh and Souther share: Unicode 18.0.0 case conversion, normalization and
# White_Space, the temporal grammar and the pattern language.
notation199x = "0.2.0"
arrayvec = { version = "0.7", default-features = false }

[features]
# Has serde_json keep every number as the text it was written with, so that the decoders read the
# input model of the Raoh Specification: `1.50` keeps its scale, `-0` is told from `-0.0`, and an
# integer of any length is read exactly. See the crate documentation.
arbitrary_precision = ["serde_json/arbitrary_precision"]
# Has serde_json keep the members of an object in the order they were written, so that issues
# about members, such as unknown_field, come in that order.
preserve_order = ["serde_json/preserve_order"]

[dev-dependencies]
proptest = "1"
# The tests read the input model of the Raoh Specification, numbers kept as written and members
# in the order written.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
